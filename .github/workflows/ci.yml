name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # macOS runner because the Commands shell out to pbcopy/pbpaste; the tests
    # mock them, but this keeps the environment honest.
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install "pytest>=8" "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -v
